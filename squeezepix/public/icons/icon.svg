<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4F46E5;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="url(#bgGradient)" />
  <!-- Diamond icon (SqueezePix logo) -->
  <g transform="translate(256, 256)">
    <!-- Outer diamond -->
    <path d="M0,-160 L140,-20 L0,160 L-140,-20 Z" fill="white" opacity="0.9" />
    <!-- Inner squeeze arrows -->
    <path d="M-60,-40 L-20,0 L-60,40" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
    <path d="M60,-40 L20,0 L60,40" fill="none" stroke="white" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.6" />
  </g>
</svg>
